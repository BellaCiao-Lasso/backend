<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="1150" height="820" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="ctx-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#37474f"/>
    </marker>
    <!-- User Icon -->
    <g id="user-icon">
      <circle cx="16" cy="12" r="8" fill="#546e7a"/>
      <path d="M 4 28 C 4 20, 10 18, 16 18 C 22 18, 28 20, 28 28 Z" fill="#546e7a"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="575" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">DIAGRAMA DE CONTEXTO (C4 MODEL - NIVEL 1)</text>
  <text x="575" y="65" text-anchor="middle" font-size="14" fill="#607d8b">Sistema Central BellaCiao, Actores (Roles de Usuario) y Sistemas Externos</text>

  <!-- ==================== CENTRAL SYSTEM ==================== -->
  <g transform="translate(425, 290)">
    <rect width="300" height="240" rx="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2.5" filter="drop-shadow(3px 6px 10px rgba(21,101,192,0.25))"/>
    <rect width="180" height="22" rx="4" fill="#1e88e5" x="60" y="16"/>
    <text x="150" y="32" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">[SOFTWARE SYSTEM]</text>
    <text x="150" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Sistema BellaCiao</text>
    
    <line x1="30" y1="85" x2="270" y2="85" stroke="#42a5f5" stroke-width="1.2"/>
    
    <text x="150" y="115" text-anchor="middle" font-size="12" fill="#e3f2fd">Plataforma integral de gestión</text>
    <text x="150" y="135" text-anchor="middle" font-size="12" fill="#e3f2fd">para trattoria italiana:</text>
    <text x="150" y="165" text-anchor="middle" font-size="11" fill="#bbdefb">• Carta digital y disponibilidad de platos</text>
    <text x="150" y="185" text-anchor="middle" font-size="11" fill="#bbdefb">• Gestión de mesas y estados de pedidos</text>
    <text x="150" y="205" text-anchor="middle" font-size="11" fill="#bbdefb">• Sincronización cocina y facturación</text>
  </g>

  <!-- ==================== ACTORS (ROLES) ==================== -->

  <!-- 1. Administrador / Gerente -->
  <g transform="translate(60, 100)">
    <rect width="250" height="95" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <use href="#user-icon" x="12" y="14"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579b">Administrador / Gerente</text>
    <text x="140" y="48" text-anchor="middle" font-size="11" fill="#0277bd">[Rol Administrativo]</text>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#37474f">Crea/edita/elimina platos, define</text>
    <text x="140" y="82" text-anchor="middle" font-size="10" fill="#37474f">precios, mesas y consulta reportes</text>
  </g>

  <!-- 2. Mesero -->
  <g transform="translate(60, 240)">
    <rect width="250" height="95" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <use href="#user-icon" x="12" y="14"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Mesero</text>
    <text x="140" y="48" text-anchor="middle" font-size="11" fill="#ef6c00">[Rol Operativo Sala]</text>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#37474f">Consulta estado de mesas, toma pedidos,</text>
    <text x="140" y="82" text-anchor="middle" font-size="10" fill="#37474f">agrega ítems y solicita precuenta</text>
  </g>

  <!-- 3. Chef / Cocinero -->
  <g transform="translate(60, 380)">
    <rect width="250" height="95" rx="6" fill="#fce4ec" stroke="#d81b60" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <use href="#user-icon" x="12" y="14"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#880e4f">Chef / Cocinero</text>
    <text x="140" y="48" text-anchor="middle" font-size="11" fill="#c2185b">[Rol Producción Cocina]</text>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#37474f">Visualiza comandas en pantalla KDS,</text>
    <text x="140" y="82" text-anchor="middle" font-size="10" fill="#37474f">cambia estado a PREPARANDO / LISTO</text>
  </g>

  <!-- 4. Cajero -->
  <g transform="translate(60, 520)">
    <rect width="250" height="95" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <use href="#user-icon" x="12" y="14"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Cajero</text>
    <text x="140" y="48" text-anchor="middle" font-size="11" fill="#2e7d32">[Rol Cobro y Caja]</text>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#37474f">Registra pagos en efectivo/tarjeta,</text>
    <text x="140" y="82" text-anchor="middle" font-size="10" fill="#37474f">cierra cuentas y libera mesas</text>
  </g>

  <!-- 5. Comensal / Cliente -->
  <g transform="translate(60, 660)">
    <rect width="250" height="95" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <use href="#user-icon" x="12" y="14"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">Comensal / Cliente</text>
    <text x="140" y="48" text-anchor="middle" font-size="11" fill="#6a1b9a">[Rol Usuario Final]</text>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#37474f">Escanea QR, consulta menú digital,</text>
    <text x="140" y="82" text-anchor="middle" font-size="10" fill="#37474f">disponibilidad y estado de su orden</text>
  </g>

  <!-- ==================== EXTERNAL SYSTEMS ==================== -->

  <!-- External 1: Pasarela de Pagos -->
  <g transform="translate(840, 160)">
    <rect width="250" height="110" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <rect width="140" height="20" rx="3" fill="#cfd8dc" x="55" y="12"/>
    <text x="125" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474f">[EXTERNAL SYSTEM]</text>
    <text x="125" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Pasarela de Pagos</text>
    <text x="125" y="75" text-anchor="middle" font-size="11" fill="#546e7a">(PSE, Stripe, Datáfonos)</text>
    <text x="125" y="93" text-anchor="middle" font-size="10" fill="#607d8b">Procesa cobros y transacciones</text>
  </g>

  <!-- External 2: Facturación DIAN -->
  <g transform="translate(840, 360)">
    <rect width="250" height="110" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <rect width="140" height="20" rx="3" fill="#cfd8dc" x="55" y="12"/>
    <text x="125" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474f">[EXTERNAL SYSTEM]</text>
    <text x="125" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Facturación DIAN</text>
    <text x="125" y="75" text-anchor="middle" font-size="11" fill="#546e7a">(Emisión Fiscal XML / PDF)</text>
    <text x="125" y="93" text-anchor="middle" font-size="10" fill="#607d8b">Valida facturas electrónicas</text>
  </g>

  <!-- External 3: Servicio Notificaciones -->
  <g transform="translate(840, 560)">
    <rect width="250" height="110" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.8" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.06))"/>
    <rect width="140" height="20" rx="3" fill="#cfd8dc" x="55" y="12"/>
    <text x="125" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474f">[EXTERNAL SYSTEM]</text>
    <text x="125" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Notificaciones KDS/SMS</text>
    <text x="125" y="75" text-anchor="middle" font-size="11" fill="#546e7a">(Pantalla Cocina / WhatsApp)</text>
    <text x="125" y="93" text-anchor="middle" font-size="10" fill="#607d8b">Despacha alertas en tiempo real</text>
  </g>

  <!-- ==================== ARROWS & LABELS ==================== -->

  <!-- Admin to BellaCiao -->
  <path d="M 310 148 L 470 148 L 470 290" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="390" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#01579b">Gestiona Carta/Mesas</text>

  <!-- Mesero to BellaCiao -->
  <path d="M 310 288 L 425 340" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="350" y="305" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Registra Pedidos</text>

  <!-- Chef to BellaCiao -->
  <line x1="310" y1="428" x2="425" y2="428" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="365" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#880e4f">Actualiza Estados</text>

  <!-- Cajero to BellaCiao -->
  <path d="M 310 568 L 425 480" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="350" y="535" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Cierra y Cobra</text>

  <!-- Cliente to BellaCiao -->
  <path d="M 310 708 L 480 708 L 480 530" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="390" y="700" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">Consulta Carta</text>

  <!-- BellaCiao to Pasarela Pago -->
  <path d="M 680 290 L 680 215 L 840 215" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="760" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Autorización de Pago</text>

  <!-- BellaCiao to DIAN -->
  <line x1="725" y1="415" x2="840" y2="415" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="782" y="405" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Envío de Factura</text>

  <!-- BellaCiao to Notificaciones -->
  <path d="M 680 530 L 680 615 L 840 615" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
  <text x="760" y="605" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Alerta KDS / Comensal</text>

</svg>
