server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bellaciao_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # opciones: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.restaurante: DEBUG
  file:
    name: logs/api-postgres.log

restaurante:
  api:
    key: "123456789"
