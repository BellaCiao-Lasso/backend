server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/bellaciao;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 

    # --- Configuración PostgreSQL (Diapositiva 4) ---
    # url: jdbc:postgresql://localhost:5432/bellaciao_db
    # username: postgres
    # password: 1234
    # driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # opciones: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    # database-platform: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.restaurante: DEBUG
  file:
    name: logs/api.log

restaurante:
  api:
    key: "123456789"
