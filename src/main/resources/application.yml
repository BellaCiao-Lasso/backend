server:
  port: 8443
  ssl:
    key-store: classpath:restaurante.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:bella2026}
    key-store-type: PKCS12
    key-alias: restaurante

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres} # Por defecto arranca en postgres, pero se puede cambiar a h2
  jpa:
    open-in-view: false
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:tu_client_id_temporal}
            client-secret: ${GOOGLE_CLIENT_SECRET:tu_secret_temporal}
            scope:
              - openid
              - profile
              - email

jwt:
  secret: TXkgc3VwZXIgc2VjcmV0IGtleSBwYXJhIGVsIHJlc3RhdXJhbnRlQmVsbGFDaWFvMjAyNg==
  expiration-ms: 3600000

restaurante:
  api:
    key: "123456789"
